name: Build Bluetooth Air Mouse APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/AirMouse-Bluetooth.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirMouse-Bluetooth-APK
          path: release/AirMouse-Bluetooth.apk
          if-no-files-found: error
      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Air Mouse Bluetooth — test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: release/AirMouse-Bluetooth.apk
          make_latest: false
          generate_release_notes: false
